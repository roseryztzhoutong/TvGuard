name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 这里刻意不用 android-actions/setup-android：
      # 它内部会执行 sdkmanager "tools"，而 legacy tools 包早已从 Google 仓库下架，
      # 找不到包就直接 exit 1，整个 job 挂在第一步。
      # GitHub 的 runner 镜像本来就自带 Android SDK，缺什么自己补就行。
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "platforms: $(ls "$SDK/platforms")"
          echo "build-tools: $(ls "$SDK/build-tools")"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      # ---------------------------------------------------------------------
      # 有密钥就签正式包，没有就退回 debug 证书。
      # fork 这个仓库的人不会配 secrets，照样能编出一个装自己设备试用的包。
      # ---------------------------------------------------------------------
      - name: Restore signing key
        # secrets 不能直接写在 if 里，先映射成 env 再判断
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KS_B64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keys/release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
          echo "已配置发布签名"

      - name: Build release
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" out/TvGuard.apk
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvGuard-apk
          path: out/TvGuard.apk
          retention-days: 90

      # 打 tag 才发 Release，普通提交只留 artifact，免得 Releases 被一堆草稿刷满
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/TvGuard.apk
          generate_release_notes: true
          body: |
            安装步骤与权限要求见仓库 README。

            提醒：本程序会申请「设备所有者」权限，一旦授予，卸载可能被系统拒绝，
            部分机型需要恢复出厂设置才能彻底摘除。请只在自己家、自己孩子的设备上使用。
